versions:
  - sha: "85a00de156d673af2db3d53f7e20616efc6243c3"
    changeNotes: |
      v2.0.0 — Consent Mode v2 defaults/updates with global denied fallback,
      stored-decision replay, exactly-once publishing of biscotti_tcf_string /
      biscotti_ac_string (explicit null after reject/withdraw), durable consent
      callback bridge, fail-closed regional rows, bounded waitForUpdate.
      Minimal reviewed permissions; no loader or credential fields.
  # `sha` points to the commit whose template.tpl is served for this version.
  # Add a new entry (with the new commit SHA) for each subsequent release.
  - sha: "eb44633f3c5acfed313c93fa254fdba7723d935a"
    changeNotes: |
      Encode the user-provided Biscotti Website ID with encodeUriComponent before
      adding it to the client-library URL. Invalid URI input skips injection.
  - sha: "117e3196965711499b8eafcf51c18fd00693158c"
    changeNotes: |
      Switch consent read from localStorage to getCookieValues (Google canonical
      consent-template pattern). All 13 unit tests pass. Permissions updated to
      get_cookies. Fixes gallery submission test failures.
  - sha: "49e51e851cb5d320e62518c99db7e66f70cd0999"
    changeNotes: "Consent Mode v2 defaults + updates from Biscotti consent storage, optional IAB TCF support (gtag_enable_tcf_support), region-specific defaults, ads_data_redaction and url_passthrough. Canonical Apache-2.0 LICENSE."
